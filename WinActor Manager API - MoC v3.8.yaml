openapi: "3.0.0"

info:
  title: WinActor Manager API
  version: "1.2.1"
  description: |
    WinActor Manager on Cloud Ver.3.8\
    © 2025 NTT Advanced Technology Corporation.

    概要
    ===
    
    WinActor Manager API Version 1.2のインタフェースについて記載を行います。

    WinActor Managerは複数のWinActorを管理し、各WinActorの状態を確認したり、
    シナリオを特定のWinActorに配布し、実行させ、
    結果を取得したりすることができます。

    WinActor Manager APIは、以下に示すリソースを操作するAPIを提供します。

    * トークン情報
    * WinActor情報
    * ファイル情報
    * シナリオ情報
    * タスク情報
    * ユーザ情報
    * イベント情報
    * スケジュール情報
    * ライセンス情報
    * ロール情報
    * 所属情報
    * ライセンスグループ情報
    * 承認情報
    * ステージ情報
    * オプションセット情報

    ---

    リクエストヘッダについて
    ===

    認証済みであることをクライアントに要求するAPIへのリクエストには、認証トークンのIDを示すリクエストヘッダ(`Authorization`)を含める必要があります。

servers:
  - url: https://localhost/v1.2
    description: サーバ

paths:
  /tokens:
    post:
      summary: 認証登録
      description: |
        トークンの払い出し
        ===

        ユーザ名とパスワードより
        WinActorManager APIにアクセスするためのトークンを生成します。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: ユーザ名《半角英数字記号》
                  type: string
                  maxLength: 64
                password:
                  description: パスワード《半角英数字記号》
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 64
              required:
                - name
                - password
            example:
              name: admin
              password: password
      responses:
        201:
          $ref: "#/components/responses/Token"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalServerError"
  /tokens/{token}:
    delete:
      summary: 認証削除
      description: |
        トークンの削除
        ===

        指定されたトークン情報を削除します。
      security:
        - Token: []
      parameters:
        - name: token
          description: 認証登録で取得したトークン文字列
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/OK"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors:
    get:
      summary: WinActor一覧取得
      description: |
        WinActor情報の一覧取得
        ===

        WinActor情報の一覧を取得します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorListGetIdType"
        - $ref: "#/components/parameters/WinActorListGetId"
        - $ref: "#/components/parameters/WinActorListGetNameType"
        - $ref: "#/components/parameters/WinActorListGetName"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
        - $ref: "#/components/parameters/WinActorStatus"
        - $ref: "#/components/parameters/FunctionTagType"
        - $ref: "#/components/parameters/FunctionTag"
        - $ref: "#/components/parameters/UpdatedAtType"
        - $ref: "#/components/parameters/UpdatedAtDate1"
        - $ref: "#/components/parameters/UpdatedAtDate2"
        - $ref: "#/components/parameters/WinActorListGetSort"
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        200:
          $ref: "#/components/responses/WinActorList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/csv:
    get:
      summary: WinActorエクスポート
      description: |
        WinActor情報のエクスポート
        ===

        指定された条件を満たすWinActor情報をエクスポートします。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/Encoding"
        - $ref: "#/components/parameters/WinActorListGetIdType"
        - $ref: "#/components/parameters/WinActorListGetId"
        - $ref: "#/components/parameters/WinActorListGetNameType"
        - $ref: "#/components/parameters/WinActorListGetName"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
        - $ref: "#/components/parameters/WinActorStatus"
        - $ref: "#/components/parameters/FunctionTagType"
        - $ref: "#/components/parameters/FunctionTag"
        - $ref: "#/components/parameters/UpdatedAtType"
        - $ref: "#/components/parameters/UpdatedAtDate1"
        - $ref: "#/components/parameters/UpdatedAtDate2"
        - $ref: "#/components/parameters/WinActorListGetSort"
        - $ref: "#/components/parameters/SortDirection"
      responses:
        200:
          description: |
            正常応答を返却します。ボディにはCSVファイルを格納します。CSVファイルの各行のカラム構成は
            'WinActorID,名前,ライセンス有効期限,WinActorバージョン,ライセンス名,ユーザ名,PC名,OS名,画面サイズ,状態,新規タスクの割当可否,機能タグ,メモ,登録日時,更新日時,自動再起動,種別,毎週何曜日,再起動実行時間,最終再起動時刻,次回再起動予定時刻,一括設定ファイル状態,一括設定ファイルID,一括設定再起動種別,一括設定再起動日付,一括設定再起動時刻,一括設定エラーコード,一括設定エラー詳細情報'
            となります。また、先頭行はヘッダ行とし、以下の固定データが配置されます。
            'WinActorID,名前,ライセンス有効期限,WinActorバージョン,ライセンス名,ユーザ名,PC名,OS名,画面サイズ,状態,新規タスクの割当可否,機能タグ,メモ,登録日時,更新日時,自動再起動,種別,毎週何曜日,再起動実行時間,最終再起動時刻,次回再起動予定時刻,一括設定ファイル状態,一括設定ファイルID,一括設定再起動種別,一括設定再起動日付,一括設定再起動時刻,一括設定エラーコード,一括設定エラー詳細情報'
            なお、改行コードは「CRLF」となります。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}:
    get:
      summary: WinActor詳細取得
      description: |
        WinActor情報の取得
        ===

        指定されたWinActorの情報を取得します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/WinActorDetail"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: WinActor更新
      description: |
        WinActorの更新
        ===

        指定されたWinActorの情報を更新します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      requestBody:
        $ref: "#/components/requestBodies/WinActorUpdate"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: WinActor削除
      description: |
        WinActor情報の削除
        ===

        指定されたWinActor情報を削除します。
        対象のWinActorの`exclude`フラグが`false`であったり、
        対象のWinActorにて実行中のタスクが存在する場合には、
        削除に失敗します(リクエスト不正)
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/stop:
    put:
      summary: WinActor停止
      description: |
        WinActorの停止
        ===

        WinActorに停止を指示します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/restart:
    put:
      summary: WinActor再起動
      description: |
        WinActorの再起動
        ===

        WinActorに再起動を指示します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/clean:
    put:
      summary: WinActorクリーン
      description: |
        WinActorのクリーン
        ===

        WinActorに次のシナリオの実行が可能となるようクリーンを指示します。
        対象WinActorでは作業ディレクトリの削除が実施され、状態はクリーン中(`CLEAN`)になります。
        また、実行中タスクがあった場合、当該タスクは中断中(`CANCELING`)になります。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/exclude:
    put:
      summary: WinActor割当停止
      description: |
        WinActorの割当停止
        ===

        WinActorへ新規タスクの割当を停止します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/include:
    put:
      summary: WinActor割当再開
      description: |
        WinActorの割当再開
        ===

        WinActorへ新規タスクの割当を再開します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /winactors/{id}/config:
    put:
      summary: WinActor一括設定情報の更新
      description: |
        WinActor一括設定情報の更新
        ===

        指定されたWinActorの一括設定情報を更新します。

        このAPIの実行には管理権限が必要です。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/WinActorId"
      requestBody:
        $ref: "#/components/requestBodies/WinActorConfig"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files:
    post:
      summary: ファイルアップロード
      description: |
        ファイルのアップロード
        ===

        ファイルをアップロードし、ファイル情報を生成します。
      security:
        - Token: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: ファイル
                  type: string
                  format: binary
                autoDeleteFlag:
                  description: |
                    自動削除フラグを指定します。`true`を指定すると自動削除の対象となります。未設定時は`false`が指定されたものとみなします。
                  type: boolean
                department1:
                  description: 親所属ID
                  type: number
                department2:
                  description: 子所属ID
                  type: number
                department3:
                  description: 孫所属ID
                  type: number
                fileTag:
                  description: |
                    ファイルタグを指定します。アップロードファイルの拡張子が`ums*`の場合、未設定時は`UMS`をファイルタグに自動設定します。
                  type: string
                  maxLength: 64
      responses:
        201:
          description: 正常応答
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: ファイルID
                    type: string
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: ファイル一覧取得
      description: |
        ファイル情報の一覧取得
        ===

        ファイル情報の一覧を取得します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileListGetIdType"
        - $ref: "#/components/parameters/FileListGetId"
        - $ref: "#/components/parameters/FileListGetNameType"
        - $ref: "#/components/parameters/FileListGetName"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
        - $ref: "#/components/parameters/AutoDeletion"
        - $ref: "#/components/parameters/CreatedAtType"
        - $ref: "#/components/parameters/CreatedAtDate1"
        - $ref: "#/components/parameters/CreatedAtDate2"
        - $ref: "#/components/parameters/CreatorNameType"
        - $ref: "#/components/parameters/CreatorName"
        - $ref: "#/components/parameters/FileTagList"
        - $ref: "#/components/parameters/FileTagOtherType"
        - $ref: "#/components/parameters/FileTagOtherName"
        - $ref: "#/components/parameters/FileListGetSort"
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        200:
          $ref: "#/components/responses/FileList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files/csv:
    get:
      summary: ファイルエクスポート
      description: |
        ファイル情報のエクスポート
        ===

        指定された条件を満たすファイル情報をエクスポートします。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/Encoding"
        - $ref: "#/components/parameters/FileListGetIdType"
        - $ref: "#/components/parameters/FileListGetId"
        - $ref: "#/components/parameters/FileListGetNameType"
        - $ref: "#/components/parameters/FileListGetName"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
        - $ref: "#/components/parameters/AutoDeletion"
        - $ref: "#/components/parameters/CreatedAtType"
        - $ref: "#/components/parameters/CreatedAtDate1"
        - $ref: "#/components/parameters/CreatedAtDate2"
        - $ref: "#/components/parameters/CreatorNameType"
        - $ref: "#/components/parameters/CreatorName"
        - $ref: "#/components/parameters/FileTagList"
        - $ref: "#/components/parameters/FileTagOtherType"
        - $ref: "#/components/parameters/FileTagOtherName"
        - $ref: "#/components/parameters/FileListGetSort"
        - $ref: "#/components/parameters/SortDirection"
      responses:
        200:
          description: |
            正常応答を返却します。ボディにはCSVファイルを格納します。CSVファイルの各行のカラム構成は
            'ファイルID,ファイル名,ファイルサイズ,登録日時,登録者,ファイルタグ'
            となります。また、先頭行はヘッダ行とし、以下の固定データが配置されます。
            'ファイルID,ファイル名,ファイルサイズ,登録日時,登録者,ファイルタグ'
            なお、改行コードは「CRLF」となります。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files/{id}:
    get:
      summary: ファイル詳細取得
      description: |
        ファイル情報の取得
        ===

        指定されたファイル情報を取得します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        200:
          $ref: "#/components/responses/File"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: ファイル削除
      description: |
        ファイル情報の削除
        ===

        指定されたファイル情報を削除します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: ファイル更新
      description: |
        ファイルの更新
        ===

        ファイル情報を更新します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        $ref: "#/components/requestBodies/FileUpdate"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files/{id}/content:
    get:
      summary: ファイルダウンロード
      description: |
        ファイルのダウンロード
        ===

        指定されたファイルをダウンロードします。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        200:
          description: 正常応答
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files/{id}/referenced:
    get:
      summary: ファイル参照情報取得
      description: |
        ファイル参照情報の取得
        ===

        指定されたファイルを参照するリソースについての情報を取得します。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/ExceptScenarioId"
        - $ref: "#/components/parameters/ExceptScheduleId"
        - $ref: "#/components/parameters/ExceptTaskId"
        - $ref: "#/components/parameters/ExceptWinactorId"
      responses:
        200:
          $ref: "#/components/responses/FileReferenced"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"
  /files/{id}/rename:
    put:
      summary: ファイル名称変更
      deprecated: true
      description: |
        ファイル名称の変更
