    TaskDetailInputParameter:
      type: object
      properties:
        name:
          description: |
            タスクパラメータ名《全角半角文字》
            kindが`schedule-output-list`、`request-list`の場合は空文字。
            「$」で開始する名称不可。以下の文字は使用不可。
            「半角スペース」「全角スペース」
            「タブ文字」「改行」
          type: string
          minLength: 1
          maxLength: 255
        kind:
          description: |
            パラメータ型を指定します。

            * `string` 値は文字列となります。
            * `file` 値はファイルIDとなります。
            * `passwd` パスワードを値にとるパラメータとなります。API呼出しユーザがスケジュール登録者以外の場合はnullとなります。
            * `schedule-status` 値は先行するスケジュールのステータスとなります。
            * `schedule-output-string` 値は文字列となります。値が設定されると`string`型として扱われます。
            * `schedule-output-file` 値はファイルIDとなります。値が設定されると`file`型として扱われます。
            * `schedule-output-list` 値はファイルIDとなります。
            * `schedule-archive-file` 値はファイルIDとなります。値が設定されると`file`型として扱われます。
            * `approval` 値は承認ステータス(審査中(`REVIEW`)、承認(`ACCEPTED`)、却下(`REJECTED`))となります。
            * `request-string` 値は文字列となります。値が設定されると`string`型として扱われます。
            * `request-file` 値はファイルIDとなります。値が設定されると`file`型として扱われます。
            * `request-list` 値はファイルIDとなります。
