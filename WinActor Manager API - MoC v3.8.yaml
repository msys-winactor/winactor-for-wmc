            データ一覧ファイル種別が`REQUEST`あるいは`OUTPUT`の時は`datadriven`を指定します。
          type: string
        taskDate:
          description: |
            日付を指定します。
            スケジュール種別が日時指定(`specified`)の場合に必須となります。フォーマットは"yyyy/MM/dd"となります。
          type: string
          format: date
        dayOfMonth:
          description: |
            月の日にちを指定します。1～31のいずれかの値を指定します。スケジュール種別が毎月(`monthly`)の場合に必須となります。
          type: integer
        dayOfWeek:
          description: |
            曜日を指定します。`sunday`、`monday`、`tuesday`、`wednesday`、`thursday`、`friday`、`saturday`のいずれかの値を指定します。スケジュール種別が毎週(`weekly`)の場合に必須となります。
          type: string
        dayOfEndMonth:
          description: |
            月末の何日前かを指定します。0～30のいずれかの値を指定します。スケジュール種別が月末(`endmonth`)の場合に必須となります。
          type: integer
        taskTime:
          description: |
            実行時刻を指定します。
            スケジュール種別が日時指定(`specified`)、毎日(`daily`)、毎週(`weekly`)、毎月(`monthly`)、月末(`endmonth`)の場合に必須となります。フォーマットは"hh:mm:ss"となります。
          type: string
          format: time
        cron:
          description: |
            実行スケジュールを示すcron式を指定します。
            スケジュール種別が条件指定(`cron`)の場合に必須となります。フォーマットは"分 時 日 月 曜日"となります。
            分には0～59までの値のいずれか一つを指定するか、"X-59/15"(15分おき)・"X-59/30"(30分おき)の指定が可能です。
            時には"X-Y"(X時からY時まで)か"X-Y/Z"(X時からY時までZ時間ごと)の指定が可能です。範囲指定しない場合は"X"または"X/Z"で指定します。値の大きさはX≦Yである必要があります。
            日には"X-Y"(X日からY日まで)か"X-Y/Z"(X日からY日までZ日ごと)の指定が可能です。範囲指定しない場合は"X"または"X/Z"で指定します。値の大きさはX≦Yである必要があります。
            月には"*"のみ指定可能です。月の指定はcronStartYearMonth、cronEndYearMonth で行ってください。
            曜日には数字で指定する方法と英省略字で指定する方法があります。日曜日は0または7またはSUNのいずれか、月曜日は1またはMONのいずれか、火曜日は2またはTUEのいずれか、
            水曜日は3またはWEDのいずれか、木曜日は4またはのTHUいずれか、金曜日は5またはFRIのいずれか、土曜日は6またはSATのいずれかである必要があります。
            複数曜日を選択する場合、"SUN,TUE,WED"や"0,2,4,6"のようにカンマで区切って指定します。
          type: string
        cronStartYearMonth:
          description: |
            スケジュール種別が条件指定(`cron`)の場合に、開始年月を指定します。フォーマットは"yyyy/MM"となります。
            値が指定された場合、指定月の始まりを指すものとします。
            未指定の場合は開始年月に関する制限はないものとみなします。
          type: string
        cronEndYearMonth:
          description: |
            スケジュール種別が条件指定(`cron`)の場合に、終了年月を指定します。フォーマットは"yyyy/MM"となります。
            値が指定された場合、指定月の終わりを指すものとします。今月もしくは今月以降の月のみ指定可能です
            未指定の場合は終了年月に関する制限はないものとみなします。
          type: string
        status:
          description: |
            状態を指定します。
            `enable`、`disable`のいずれかの値を指定します。
            未設定時は`enable`を指定したものとみなします。
          type: string
        description:
          description: メモ
          type: string
          maxLength: 200
        inputParameters:
          description: | 
            入力パラメータ
            スケジュール種別にデータ駆動(`datadriven`)を指定した場合のみ、1つ以上のパラメータ指定が必須となります。
            データ駆動(`datadriven`)以外のスケジュール種別で指定できる入力パラメータは文字列型(`string`)、ファイル型(`file`)のみとなります。
          type: array
          items:
            $ref: "#/components/schemas/ScheduleCreationParameter"
        log:
          description: |
            実行時のログを取得する(`true`)か、取得しない(`false`)かを指定します。
            省略時は取得しません(`false`)。
          type: boolean
        archive:
          description: |
            作業ディレクトリをzip化してアップロードする(`true`)か、しない(`false`)かを指定します。
            省略時はzip化及びアップロードは実施しません(`false`)。
          type: boolean
        onError:
          description: |
            エラー時の挙動として、
            作業ディレクトリとWinActorをエラー状態のまま残す(`halt`)か、
            作業ディレクトリを掃除し、WinActorをクリーンする(`clean`)か
            を指定します。
            省略時はクリーンします(`clean`)。
          type: string
        dataListFileId:
          description: |
            データ一覧ファイル種別が`FILE`の場合に、対象データ一覧ファイルIDを指定します。
          type: string
        winactors:
          description: | 
            実行対象のWinActorIDリスト
            本パラメータにWinActorIDを指定する際、同時にnumOfDataDivisionsパラメータを2以上に設定することはできません。
          type: array
          items:
            description: WinActorID
            type: string
        retryNum:
          description: | 
            リトライ回数
            本パラメータを1以上に設定すると、タスク実行失敗(`ERROR`)の際に新規タスクを生成してリトライを行います。
          type: integer
        retryInterval:
          description: リトライ間隔(秒)
          type: integer
        numOfDataDivisions:
          description: |
            データ一覧ファイルのループ処理を複数WinActorに分割・分配するかを指定します。
            2以上の時は分割を行い、1の場合は分割を行いません。
            ただし、ヘッダ行を除いたデータ一覧ファイルの行数以上の数は指定できません。
            本パラメータを2以上に設定する際、同時にwinactorsパラメータを設定することはできません。
          type: integer
        dataListFileType:
          description: |
            データ一覧ファイル種別を指定します。
            データ一覧ファイルがfilesテーブルに登録されている場合は`FILE`を、
            スケジュール引数登録API経由で与えられる場合は`REQUEST`を指定します。
            他のスケジュールの出力パラメータにより与えられる場合は`OUTPUT`を指定します。
          type: string
        dataListFileScheduleId:
          description: |
            データ一覧ファイル種別が`OUTPUT`の場合に、対象スケジュールIDを指定します。
          type: string
        dataListFileScheduleOutputName:
          description: |
            データ一覧ファイル種別が`OUTPUT`の場合に、対象出力パラメータ名を指定します。
          type: string
        sendMail:
          description: |
            タスク終了時のメール送信契機を指定します。
            送信しない(`neither`)、終了時に送信する(`both`)、異常終了時時にのみ送信する(`onError`)、正常終了時にのみ送信する(`onNormal`)の中から1つを指定します。
            未設定時は`onError`を指定したものとみなします。
          type: string
      required:
        - name
        - scenarioId
        - kind
    ScheduleCreationParameter:
      type: object
      properties:
        name:
          description: |
            パラメータ名《全角半角文字》

            「$」で開始する名称不可。以下の文字は使用不可。

            「半角スペース」「全角スペース」
            「タブ文字」「改行」
          type: string
          minLength: 1
          maxLength: 255
        value:
          description: 値《全角半角文字》
          type: string
          maxLength: 10000
        kind:
          description: |
            パラメータ型を指定します。

            * `string` 文字列を値にとるパラメータとなります。
            * `file` ファイルIDを値にとるパラメータとなります。 
            * `passwd` パスワードを値にとるパラメータとなります。
            * `approval` ユーザ承認を本スケジュールの実行条件とします。値は空となります。
            * `schedule-status` 先行するスケジュールのステータスを実行条件とします。先行スケジュールIDを値にとるパラメータとなります。
            * `schedule-output-string` 先行するスケジュールの出力パラメータ(文字列)を入力パラメータとします。先行スケジュールIDを値にとるパラメータとなります。データ分割した親スケジュールは指定できません。
            * `schedule-output-file` 先行するスケジュールの出力パラメータ(ファイル)を入力パラメータとします。先行スケジュールIDを値にとるパラメータとなります。データ分割した親スケジュールは指定できません。
            * `schedule-archive-file` 先行するスケジュールのアーカイブファイルを入力パラメータとします。先行スケジュールIDを値にとるパラメータとなります。データ分割した親スケジュールは指定できません。
            * `request-string` 外部リクエスト(文字列)を入力パラメータとします。値は空となります。
            * `request-file` 外部リクエスト(ファイル)を入力パラメータとします。値は空となります。
          type: string
        setting:
          description: |
            kindに`schedule-status`を指定した場合にはタスクのステータスを設定します。
            先行タスクの実行結果がこの値と一致する場合のみ、本スケジュールを実行します。
            値には正常終了(`FINISH`)、異常終了(`ERROR`)、正常終了または異常終了(`BOTH`)のいずれかを指定できます。
            kindに`schedule-output-string`もしくは`schedule-output-file`を指定した場合は、先行するスケジュールの出力パラメータ名を指定します。
            kindに`approval`を指定した場合には承認するユーザのユーザIDを指定します。
            kindが`string`、`file`、`passwd`、`schedule-archive-file`、`request-string`、`request-file`の場合は、指定できません。また値を指定した場合は使用されません。
          type: string
    ScheduleIds:
      type: array
