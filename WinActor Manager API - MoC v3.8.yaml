components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          description: 問題の要約
          type: string
        detail:
          description: 問題の説明
          type: string
        instance:
          description: リクエストパス
          type: string
    BadRequestResponse:
      type: object
      properties:
        error:
          description: 問題の要約
          type: string
        detail:
          description: 問題の説明
          type: string
        instance:
          description: リクエストパス
          type: string
        errorParameter:
          description: エラーパラメータ名（エラーの内容によってはこの項目が存在しないことがあります）
          type: string
    Id:
      type: object
      properties:
        id:
          description: ID《半角英数字記号》
          type: string
          maxLength: 32
    LicenseGroupId:
      type: object
      properties:
        id:
          description: ライセンスグループID
          type: integer
    Token:
      type: object
      properties:
        token:
          description: トークン《半角英数字記号》
          type: string
          maxLength: 32
    WinActor:
      type: object
      properties:
        id:
          description: WinActorID《半角英数字記号》
          type: string
          maxLength: 32
        name:
          description: WinActorの名前（ユーザ@アドレス）《全角半角文字》
          type: string
          minLength: 1
          maxLength: 512
        status:
          description: WinActorの状態《半角英数字記号》
          type: string
          maxLength: 10
        functionTag:
          description: 機能タグ
          type: string
        exclude:
          description: 新規タスクの割当を行うか否か
          type: boolean
        type:
          description: NL(ノードロック)、FL(フローティングライセンス)
          type: string
        evaluation:
          description: true(評価版)、false(製品版)
          type: boolean
        feature:
          description: FULL(フル機能版)、RUN(実行版)、MANAGED_RUN(管理実行版)
          type: string
        deathtime:
          description: 有効期限(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        userName:
          description: WinActorの起動しているデスクトップのユーザ名《全角半角文字》
          type: string
        ipaddress:
          description: WinActorが管理サーバにアクセスした際のアクセス元のIPアドレス
          type: string
        pcName:
          description: WinActorの起動しているデスクトップのPC名《全角半角文字》
          type: string
        createdAt:
          description: 作成日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        createdTime:
          description: 作成日時(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        updatedAt:
          description: 更新日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        updatedTime:
          description: 更新日時(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        department1:
          description: 親所属ID
          type: integer
        department2:
          description: 子所属ID
          type: integer
        department3:
          description: 孫所属ID
          type: integer
        departmentName:
          description: 所属名《全角半角文字》(親所属名と子所属名と孫所属名を、半角スペース区切りで連結した値)
          type: string
          minLength: 1
    WinActorUpdate:
      type: object
      properties:
        name:
          description: WinActorの名前（ユーザ@アドレス）《全角半角文字》
          type: string
          minLength: 1
          maxLength: 512
        department1:
          description: 親所属ID
          type: integer
        department2:
          description: 子所属ID
          type: integer
        department3:
          description: 孫所属ID
          type: integer
        description:
          description: メモ
          type: string
          maxLength: 200
        functionTag:
          description: 機能タグ
          type: string
          maxLength: 64
        autoReboot:
          description: 自動再起動を指定します。`true`(自動再起動する)か`false`(自動再起動しない)のいずれかを指定します。未設定時は`false`が指定されたものとみなします。
          type: boolean
        kind:
          description: |
            自動再起動種別を指定します。
            自動再起動が`true`(自動再起動する)の場合に必須となります。毎日(`daily`)、毎週(`weekly`)の中から1つを指定します。
          type: string
        dayOfWeek:
          description: |
            曜日を指定します。`sunday`、`monday`、`tuesday`、`wednesday`、`thursday`、`friday`、`saturday`のいずれかの値を指定します。自動再起動種別が毎週(`weekly`)の場合に必須となります。
          type: string
        rebootTime:
          description: |
            自動再起動実行時刻を指定します。
            自動再起動が`true`(自動再起動する)の場合に必須となります。フォーマットは"hh:mm:ss"となります。
          type: string
          format: time
      required:
        - name
    WinActorList:
      type: object
      properties:
        total:
          description: 総件数
          type: integer
          minimum: 0
        totalPages:
          description: 総ページ数
          type: integer
          minimum: 0
        currentPage:
          description: 現在ページ
          type: integer
          minimum: 0
        items:
          description: 検索結果
          type: array
          items:
            $ref: "#/components/schemas/WinActor"
    WinActorDetail:
      type: object
      properties:
        id:
          description: WinActorID《半角英数字記号》
          type: string
          maxLength: 32
        name:
          description: WinActorの名前（ユーザ@アドレス）《全角半角文字》
          type: string
          minLength: 1
          maxLength: 512
        status:
          description: WinActorの状態《半角英数字記号》
          type: string
          maxLength: 10
        description:
          description: メモ
          type: string
        functionTag:
          description: 機能タグ
          type: string
        exclude:
          description: 新規タスクの割当を行うか否か
          type: boolean
        type:
          description: NL(ノードロック)、FL(フローティングライセンス)
          type: string
        evaluation:
          description: true(評価版)、false(製品版)
          type: boolean
        feature:
          description: FULL(フル機能版)、RUN(実行版)、MANAGED_RUN(管理実行版)
          type: string
        deathtime:
          description: 有効期限(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        licenseGroupName:
          description: ライセンスグループ名
          type: string
        version:
          description: バージョン情報
          type: string
        locale:
          description: ロケール
          type: string
        timeZone:
          description: タイムゾーン情報
          type: string
        printName:
          description: 印字用文字列
          type: string
        installPath:
          description: インストールパス
          type: string
        userName:
          description: WinActorの起動しているデスクトップのユーザ名《全角半角文字》
          type: string
        ipaddress:
          description: WinActorが管理サーバにアクセスした際のアクセス元のIPアドレス
          type: string
        pcName:
          description: WinActorの起動しているデスクトップのPC名《全角半角文字》
          type: string
        osName:
          description: WinActorの起動しているデスクトップのOS名
          type: string
        screenSize:
          description: 画面サイズ
          type: string
        createdAt:
          description: 作成日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        createdTime:
          description: 作成日時(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        updatedAt:
          description: 更新日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        updatedTime:
          description: 更新日時(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        taskId:
          description: タスクID
          type: string
        department1:
          description: 親所属ID
          type: integer
        department2:
          description: 子所属ID
          type: integer
        department3:
          description: 孫所属ID
          type: integer
        departmentName:
          description: 所属名《全角半角文字》(親所属名と子所属名と孫所属名を、半角スペース区切りで連結した値)
          type: string
          minLength: 1
        autoReboot:
          description: true(自動再起動する)、false(自動再起動しない)
          type: boolean
        kind:
          description: 自動再起動種別(daily(毎日)、weekly(毎週))
          type: string
        dayOfWeek:
          description: |
            自動再起動の曜日(sunday(日曜日)、monday(月曜日)、tuesday(火曜日)、wednesday(水曜日)、thursday(木曜日)、friday(金曜日)、saturday(土曜日))
          type: string
        rebootTime:
          description: |
            自動再起動実行時刻("hh:mm:ss"形式)
          type: string
          format: time
        lastRebootTime:
          description: 最終再起動時刻(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        nextRebootTime:
          description: 次回再起動予定時刻(ミリ秒で表したUNIXタイム)
          type: integer
          format: int64
        configState:
          description: |
            一括設定ファイル状態
            指定無し(`INIT`)、指定後未設定(`WAITING`)、設定中(`PROCESSING`)、設定済み(`SUCCESS`)、設定失敗(`FAILURE`)、設定後更新済み(`UPDATED`)
          type: string
        configFileId:
          description: |
            一括設定ファイルID
          type: string
        configFileName:
          description: |
            一括設定ファイル名
          type: string
        configRebootKind:
          description: |
            一括設定再起動種別
            即時実行(`immediately`)、日時指定(`specified`)
          type: string
        configRebootDate:
          description: |
            一括設定再起動日付
          type: string
          format: date
        configRebootTime:
          description: |
            一括設定再起動時刻
          type: string
          format: time
        configErrorCode:
          description: |
            一括設定エラーコード
          type: integer
        configError:
          description: |
            一括設定エラー詳細情報
          type: string
    WinActorConfig:
      type: object
