    LicenseListGetSortDirection:
      description: |
        ソート昇降順を指定します。
        `asc` (昇順)または `desc` (降順)を指定します。
        未設定時は`asc`を指定したものとみなされます。
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    LicenseGroupNameType:
      description: |
        ライセンスグループ名検索条件を指定します。
        `perfect`(完全一致)または`partial`(部分一致)を指定します。
        未設定時は`perfect`を指定したものとみなされます。
      name: licenseGroupNameType
      in: query
      required: false
      schema:
        type: string
        enum:
          - perfect
          - partial
        default: perfect
    LicenseGroupName:
      description: |
        ライセンスグループ名を指定します。全角半角文字で最大64桁です。
      name: licenseGroupName
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    ScheduledAtType:
      description: |
        タスク実行予定日時条件を指定します。
        `range`(範囲指定)、`before`(終了日時のみ指定)、`after`(開始日時のみ指定)のいずれかを指定します。
        未設定時は`range`を指定したものとみなされます。
      name: scheduledAtType
      in: query
      required: false
      schema:
        type: string
        enum:
          - range
          - before
          - after
        default: range
    ScheduledAtDate1:
      description: |
        タスク実行予定日時1を指定します。
        タスク実行予定日時条件が`range`の場合、タスク実行予定日時2より値が小さくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: scheduledAtDate1
      in: query
      required: false
      schema:
        type: string
        format: date
    ScheduledAtDate2:
      description: |
        タスク実行予定日時2を指定します。
        タスク実行予定日時条件が`range`の場合、タスク実行予定日時1より値が大きくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: scheduledAtDate2
      in: query
      required: false
      schema:
        type: string
        format: date
    StageListGetSort:
      description: |
        ソート項目を指定します。
        `id`、`scheduleName`、`updatedAt`のいずれかを指定します。
        未設定時は`updatedAt`を指定したものとみなされます。
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - id
          - scheduleName
          - updatedAt
        default: updatedAt
    StageListGetIdType:
      description: |
        ステージID検索条件を指定します。
        `perfect`(完全一致)または `partial`(部分一致)を指定します。
        未設定時は`perfect`を指定したものとみなされます。
      name: idType
      in: query
      required: false
      schema:
        type: string
        enum:
          - perfect
          - partial
        default: perfect
    StageListGetStageId:
      description: |
        ステージIDを指定します。
        半角英数字記号で最大32桁です。
      name: id
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    StageListGetNameType:
      description: |
        先頭スケジュール名検索条件を指定します。
        `perfect`(完全一致)または `partial`(部分一致)を指定します。
        未設定時は`perfect`を指定したものとみなされます。
      name: scheduleNameType
      in: query
      required: false
      schema:
        type: string
        enum:
          - perfect
          - partial
        default: perfect
    StageListGetName:
      description: |
        先頭スケジュール名を指定します。
        全角半角文字で最大64桁です。
      name: scheduleName
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    StageListGetUpdatedAtType:
      description: |
        先頭スケジュールの更新日時条件を指定します。
        `range`(範囲指定)、`before`(終了日時のみ指定)、`after`(開始日時のみ指定)のいずれかを指定します。
        未設定時は`range`を指定したものとみなされます。
      name: updatedAtType
      in: query
      required: false
      schema:
        type: string
        enum:
          - range
          - before
          - after
        default: range
    StageListGetUpdatedAtDate1:
      description: |
        先頭スケジュールの更新日時1を指定します。
        更新日時条件が`range`の場合、更新日時2より値が小さくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: updatedAtDate1
      in: query
      required: false
      schema:
        type: string
        format: date
    StageListGetUpdatedAtDate2:
      description: |
        先頭スケジュールの更新日時2を指定します。
        更新日時条件が`range`の場合、更新日時1より値が大きくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: updatedAtDate2
      in: query
      required: false
      schema:
        type: string
        format: date
    StageHistoryGetSort:
      description: |
        ソート項目を指定します。
        `id`、`scheduleName`、`status`、`startedAt`、`finishedAt`のいずれかを指定します。
        未設定時は`startedAt`を指定したものとみなされます。
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - id
          - scheduleName
          - status
          - startedAt
          - finishedAt
        default: startedAt
    ExceptScenarioId:
      description: |
        参照情報から除外するシナリオのIDを指定します。半角英数字記号で最大32桁です。
      name: exceptScenarioId
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    ExceptScheduleId:
      description: |
        参照情報から除外するスケジュールのIDを指定します。半角英数字記号で最大32桁です。
      name: exceptScheduleId
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    ExceptTaskId:
      description: |
        参照情報から除外するタスクのIDを指定します。半角英数字記号で最大32桁です。
      name: exceptTaskId
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    ExceptWinactorId:
      description: |
        参照情報から除外するWinActorのIDを指定します。半角英数字記号で最大32桁です。
      name: exceptWinactorId
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    CalendarType:
      description: |
        検索日時条件を指定します。
        `range`(範囲指定)、`before`(終了日時のみ指定)、`after`(開始日時のみ指定)のいずれかを指定します。
        未設定時は`range`を指定したものとみなされます。
        `before`もしくは`after`を指定した場合、31日間を範囲として検索を行います。
        `range`を指定した場合、32日間以上の範囲を指定することは出来ません。
      name: calendarType
      in: query
      required: false
      schema:
        type: string
        enum:
          - range
          - before
          - after
        default: range
    CalendarDate1:
      description: |
        検索日時1を指定します。
        検索日時条件が`range`の場合、検索日時2より値が小さくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: calendarDate1
      in: query
      required: false
      schema:
        type: string
        format: date
    CalendarDate2:
      description: |
        検索日時2を指定します。
        検索日時条件が`range`の場合、検索日時1より値が大きくなければなりません。
        同日は可能です。
        ※日時フォーマット："yyyy/MM/dd"
      name: calendarDate2
      in: query
      required: false
      schema:
        type: string
        format: date
    CalendarSize:
      description: |
        取得件数を指定します。
        未設定時は1000を指定したものとみなされます。
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
    ParameterName:
      description: |
        取得対象とするスケジュールパラメータ名を指定します。
        空文字列の場合は、kindが`request-list`および`schedule-output-list`の引数を取得します。
      name: parameterName
      in: query
      required: true
      schema:
        type: string
        maxLength: 255
    CreatedAtTime1:
      description: |
        登録日時1の時間を指定します。
        未設定時は`range` もしくは `after`の場合は"00:00:00"、`before`の場合は"23:59:59"とみなされます。
        ※時間フォーマット："hh:mm:ss"
      name: createdAtTime1
      in: query
      required: false
      schema:
        type: string
        format: time
    CreatedAtTime2:
      description: |
        登録日時2の時間を指定します。
        登録日時条件が`range`の場合、本パラメータが使用されます。
        未設定時は"23:59:59"とみなされます。
        ※時間フォーマット："hh:mm:ss"
      name: createdAtTime2
      in: query
      required: false
      schema:
        type: string
        format: time
    EventListGetLabel:
      description: |
        イベントラベルを指定します。
        最大100件までの複数指定も可能です。
        未設定時は条件を設定しません。
      name: label[]
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    WinActorIdList:
      description: |
        WinActorIDを指定します。
        最大100件までの複数指定も可能です。
        未設定時は条件を設定しません。
      name: winactorId[]
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    SimpleMode:
      description: |
        シンプルモードを指定します。
        `true`または`false`を指定します。
        未設定時は条件なしとします。
      name: simpleMode
      in: query
      required: false
      schema:
        type: string
        enum:
          - true
          - false
    TargetWinActorIdList:
      description: |
        タスク実行予定WinActorIDを指定します。
        `null`という文字列を指定する場合は実行予定WinActorが未指定のタスクを返却します。
        最大100件までの複数指定も可能です。
        未設定時は条件を設定しません。
      name: targetWinactorId[]
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    OptionSetId:
      description: オプションセットID
      name: id
      in: path
      required: true
      schema:
        type: string
