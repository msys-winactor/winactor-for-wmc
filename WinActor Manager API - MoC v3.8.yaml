      description: |
        WinActor利用状況のエクスポート
        ===

        指定された条件を満たすWinActor利用状況をエクスポートします。
        ライセンスグループ名を変更した場合、変更前までの利用状況は変更前のライセンスグループ名として集計します。
        検索したWinActor数が10000件を超える場合、利用状況は出力できません。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/Encoding"
        - $ref: "#/components/parameters/WinActorListGetIdType"
        - $ref: "#/components/parameters/WinActorListGetId"
        - $ref: "#/components/parameters/WinActorListGetNameType"
        - $ref: "#/components/parameters/WinActorListGetName"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
        - $ref: "#/components/parameters/WinActorStatus"
        - $ref: "#/components/parameters/FunctionTagType"
        - $ref: "#/components/parameters/FunctionTag"
        - $ref: "#/components/parameters/UpdatedAtType"
        - $ref: "#/components/parameters/UpdatedAtDate1"
        - $ref: "#/components/parameters/UpdatedAtDate2"
        - $ref: "#/components/parameters/PeriodAtType"
        - $ref: "#/components/parameters/PeriodAtDate1"
        - $ref: "#/components/parameters/PeriodAtDate2"
        - $ref: "#/components/parameters/LicenseType"
        - $ref: "#/components/parameters/LicenseGroupNameType"
        - $ref: "#/components/parameters/LicenseGroupName"
        - $ref: "#/components/parameters/WinActorListGetSort"
        - $ref: "#/components/parameters/SortDirection"
      responses:
        200:
          description: |
            正常応答を返却します。ボディにはCSVファイルを格納します。CSVファイルの各行のカラム構成は
            'WinActorID,WinActor名,ライセンスグループ名,種別,ライセンス名,timestamp,所属名1,所属名2,所属名3,PC名,ユーザ名,stop(ms),boot(ms),reboot(ms),waiting(ms),processing(ms),operating(local exec)(ms),operating(other)(ms),unlicense(ms),clean(ms),error(ms),unknown(ms)'
            となります。また、先頭行はヘッダ行とし、以下の固定データが配置されます。
            'WinActorID,WinActor名,ライセンスグループ名,種別,ライセンス名,timestamp,所属名1,所属名2,所属名3,PC名,ユーザ名,stop(ms),boot(ms),reboot(ms),waiting(ms),processing(ms),operating(local exec)(ms),operating(other)(ms),unlicense(ms),clean(ms),error(ms),unknown(ms)'
            なお、改行コードは「CRLF」となります。
            集計は毎日実施し、WinActor名、種別、所属名、PC名、ユーザ名は集計時点の情報となります。
            ライセンスグループ名はライセンス払い出し時の名称となります。
            1日の中でライセンスグループ名を変更した場合、変更前までの利用状況は変更前のライセンスグループ名として集計します。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
