            水曜日は3またはWEDのいずれか、木曜日は4またはのTHUいずれか、金曜日は5またはFRIのいずれか、土曜日は6またはSATのいずれかである必要があります。
            複数曜日を選択する場合、"SUN,TUE,WED"や"0,2,4,6"のようにカンマで区切って指定します。
          type: string
        cronStartYearMonth:
          description: |
            スケジュール種別が条件指定(`cron`)の場合に、開始年月を指定します。フォーマットは"yyyy/MM"となります。
            値が指定された場合、指定月の始まりを指すものとします。
            未指定の場合は開始年月に関する制限はないものとみなします。
          type: string
        cronEndYearMonth:
          description: |
            スケジュール種別が条件指定(`cron`)の場合に、終了年月を指定します。フォーマットは"yyyy/MM"となります。
            値が指定された場合、指定月の終わりを指すものとします。今月もしくは今月以降の月のみ指定可能です
            未指定の場合は終了年月に関する制限はないものとみなします。
          type: string
        status:
          description: |
            状態を指定します。
            `enable`、`disable`のいずれかの値を指定します。
          type: string
        description:
          description: メモ
          type: string
        inputParameters:
          description: 入力パラメータ
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDetailParameter"
        arguments:
          description: |
            スケジュール引数
            データ駆動型(`data-driven`)のスケジュールが保持する未使用の引数です。
            保持する未使用の引数は各入力パラメータにつき最も古いもの１つです。
          type: array
          items:
            $ref: "#/components/schemas/ScheduleArguments"
        stageId:
          description: シナリオ連携機能を使用する際のステージID《半角英数字記号》
          type: string
          maxLength: 32
        parentScheduleId:
          description: データ一覧を分割する際の親スケジュールID《半角英数字記号》
          type: string
          maxLength: 32
        retryNum:
          description: リトライ回数
          type: integer
        retryInterval:
          description: リトライ間隔(秒)
          type: integer
        numOfDataDivisions:
          description: |
            データ一覧ファイルのループ処理を複数WinActorに分割・分配するかを指定します。
            2以上の時は分割を行い、1の場合は分割を行いません。
          type: integer
        dataListFileType:
          description: |
            データ一覧ファイル種別を指定します。
            データ一覧ファイルがfilesテーブルに登録されている場合は`FILE`を、
            スケジュール引数登録API経由で与えられる場合は`REQUEST`を指定します。
            他のスケジュールの出力パラメータにより与えられる場合は`OUTPUT`を指定します。
          type: string
        dataListFileRequestId:
          description: データ一覧ファイルのリクエストID《半角英数字記号》
          type: string
          maxLength: 32
        dataListFileScheduleId:
          description: |
            データ一覧ファイル種別が`OUTPUT`の場合に、対象スケジュールIDを指定します。
          type: string
          maxLength: 32
        dataListFileScheduleOutputName:
          description: |
            データ一覧ファイル種別が`OUTPUT`の場合に、対象出力パラメータ名を指定します。
          type: string
        createdAt:
          description: 作成日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        createdTime:
          description: 作成日時(ミリ秒で表したUNIXタイム)
          type: integer
        creatorId:
          description: 作成者のユーザID《半角英数字記号》
          type: string
        creatorName:
          description: 作成者名
          type: string
        updatedAt:
          description: 更新日時("yyyy/MM/dd HH:mm:ss"形式)
          type: string
          deprecated: true
        updatedTime:
          description: 更新日時(ミリ秒で表したUNIXタイム)
          type: integer
    ScheduleDetailParameter:
      type: object
      properties:
        name:
          description: |
            パラメータ名《全角半角文字》
            kindが`schedule-output-list`、`request-list`の場合は空文字。
            「$」で開始する名称不可。以下の文字は使用不可。
            「半角スペース」「全角スペース」
            「タブ文字」「改行」
          type: string
          minLength: 1
          maxLength: 255
        kind:
          description: |
            パラメータ型を指定します。

            * `string` 文字列を値にとるパラメータとなります。
            * `file` ファイルIDを値にとるパラメータとなります。
            * `passwd` パスワードを値にとるパラメータとなります。API呼出しユーザがスケジュール登録者以外の場合はnullとなります。
            * `approval` 後続スケジュールを実行する際に承認を要求する承認するユーザのユーザ名を値にとるパラメータとなります。
            * `schedule-status` 先行するスケジュールIDを値にとるパラメータとなります。
            * `schedule-output-string` 先行するスケジュールIDを値にとるパラメータとなります。
            * `schedule-output-file` 先行するスケジュールIDを値にとるパラメータとなります。
            * `schedule-output-list` 先行するスケジュールIDを値にとるパラメータとなります。
            * `schedule-archive-file` 先行するスケジュールIDを値にとるパラメータとなります。
            * `request-string` リクエストIDを値にとるパラメータとなります。
            * `request-file` リクエストIDを値にとるパラメータとなります。
            * `request-list` リクエストIDを値にとるパラメータとなります。
          type: string
        value:
          description: 省略時の値。省略した場合は""(空文字)となります。《全角半角文字》
          type: string
          maxLength: 10000
        required:
          description: |
            必須か否かを指定します。
          type: boolean
        description:
          description: | 
            パラメータの説明《全角半角文字》
          type: string
          maxLength: 200
        setting:
          description: |
            kindに`schedule-status`を指定した場合、先行タスクの実行結果がこの値と一致する場合のみ、本スケジュールを実行します。
            値には正常終了(`FINISH`)、異常終了(`ERROR`)、実行取消(`CANCEL`)のいずれかが格納されます。
            kindに`schedule-output-string`もしくは`schedule-output-file`、`schedule-output-list`を指定した場合は、先行するスケジュールのシナリオ出力パラメータ名が格納されます。
            kindに`approval`を指定した場合には承認するユーザのユーザIDが格納されます。
          type: string
    ScheduleArguments:
