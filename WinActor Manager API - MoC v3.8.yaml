          description: シナリオ実行時のタイムアウト初期値（単位は秒）。
          type: integer
          default: 1800
          minimum: 0
          maximum: 86400
    UserInitialAutoLogoutResponse:
      type: object
      properties:
        userInitialAutoLogout:
          description: オートログアウト初期値（単位は秒）。
          type: integer
          default: 1800
          minimum: 60
          maximum: 86400
    OptionSetCreation:
      type: object
      properties:
        name:
          description: オプションセット名《全角半角文字》
          type: string
          maxLength: 64
        archive:
          description: |
            作業ディレクトリをzip化してアップロードする(`true`)か、しない(`false`)かを指定します。
            省略時はzip化及びアップロードは実施しません(`false`)。
          type: boolean
        log:
          description: |
            実行時のログを取得する(`true`)か、取得しない(`false`)かを指定します。
            省略時は取得しません(`false`)。
          type: boolean
        onError:
          description: |
            エラー時の挙動として、
            作業ディレクトリとWinActorをエラー状態のまま残す(`halt`)か、
            作業ディレクトリを掃除し、WinActorをクリーンする(`clean`)か
            を指定します。
            省略時はクリーンします(`clean`)。
          type: string
        sendMail:
          description: |
            タスク終了時のメール送信契機を指定します。
            送信しない(`neither`)、終了時に送信する(`both`)、異常終了時時にのみ送信する(`onError`)、正常終了時にのみ送信する(`onNormal`)の中から1つを指定します。
            未設定時は`onError`を指定したものとみなします。
          type: string
        retryNum:
          description: | 
            リトライ回数
            本パラメータを1以上に設定すると、タスク実行失敗(`ERROR`)の際に新規タスクを生成してリトライを行います。
          type: integer
        retryInterval:
          description: リトライ間隔(秒)
          type: integer
        description:
          description: |
            スケジュール登録時のメモを指定します。
          type: string
          maxLength: 200
        remarks:
          description: |
            オプションセットの説明を指定します。
          type: string
          maxLength: 200
      required:
        - name
    OptionSetList:
      type: object
      properties:
        total:
          description: 総件数
          type: integer
          minimum: 0
        items:
          description: 検索結果
          type: array
          items:
            $ref: "#/components/schemas/OptionSetListItem"
    OptionSetListItem:
      type: object
      properties:
        id:
          description: オプションセットID《半角英数字記号》
          type: string
          maxLength: 32
        name:
          description: オプションセット名《全角半角文字》
          type: string
          maxLength: 64
        remarks:
          description: 説明
          type: string
          maxLength: 200
    OptionSetDetail:
      type: object
      properties:
        id:
          description: オプションセットID《半角英数字記号》
          type: string
          maxLength: 32
        name:
          description: オプションセット名《全角半角文字》
          type: string
          maxLength: 64
        archive:
          description: |
            作業ディレクトリをzip化してアップロードする(`true`)か、しない(`false`)かを表します。
          type: boolean
        log:
          description: |
            実行時のログを取得する(`true`)か、取得しない(`false`)かを表します。
          type: boolean
        onError:
          description: |
            エラー時の挙動として、
            作業ディレクトリとWinActorをエラー状態のまま残す(`halt`)か、
            作業ディレクトリを掃除し、WinActorをクリーンする(`clean`)か
            を表します。
        sendMail:
          description: |
            タスク終了時のメール送信契機を指定します。
            送信しない(`neither`)、終了時に送信する(`both`)、異常終了時時にのみ送信する(`onError`)、正常終了時にのみ送信する(`onNormal`)の中から1つを表します。
          type: string
        retryNum:
          description: リトライ回数
          type: integer
        retryInterval:
          description: リトライ間隔(秒)
          type: integer
        description:
          description: メモ
          type: string
        remarks:
          description: 説明
          type: string
          maxLength: 200
