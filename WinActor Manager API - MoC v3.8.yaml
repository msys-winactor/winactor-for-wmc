    put:
      summary: ライセンスグループ更新
      description: |
        ライセンスグループの更新
        ===

        ライセンスグループを更新します。

        このAPIの実行には管理権限が必要です。

        名前で指定されるライセンスグループの情報の更新を行います。

        指定された名前のライセンスグループの情報が存在しない場合には、新規に作成を行い、
        指定された名前のライセンスグループの情報が存在する場合には、その情報の更新を行います。
        licenses配列に空が指定された場合には、該当するライセンスグループの情報を削除します。

        新規作成時は、新パスワードは8文字以上、72文字以下の英数字記号である必要があります。
        更新時、新パスワードが空文字列の場合、パスワードの更新は行いません。
        更新時、新パスワードが8文字以上、72文字以下の英数字記号である場合には、パスワードの更新を行います。
      security:
        - Token: []
      requestBody:
        $ref: "#/components/requestBodies/LicenseGroupModification"
      responses:
        200:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
