            * `request-file` 値はファイルIDとなります。
            * `request-list` 値はファイルIDとなります。
          type: string
        value:
          description: 値。《全角半角文字》
          type: string
        description:
          description: 説明《全角半角文字》
          type: string
          maxLength: 200
        userId:
