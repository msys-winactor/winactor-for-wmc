          format: int64
    OptionForOperationItem:
      type: object
      properties:
        key:
          description: 
            更新対象のパラメータ名を指定します。指定可能なパラメータ名は以下の通りです。
            * `winactor-delete-assigned-task` タスク割り当て済みWinActorの削除可否。値には「削除可能とする(`true`)」または「削除不可とする(`false`)」を指定できます。
            * `winactor-delete-assigned-user` ユーザ割り当て済みWinActorの削除可否。値には「削除可能とする(`true`)」または「削除不可とする(`false`)」を指定できます。
            * `winactor-operation-function-tag` 機能タグ設定時の動作。値には「機能タグ未設定のシナリオ実行を許可する(`empty`)」または「機能タグ完全一致のみシナリオ実行を許可する(`exact`)」を指定できます。
            * `winactor-initial-assigned-task` WinActor登録時のタスク割り当て可否。値には「割り当て可能とする(`true`)」または「割り当て不可とする(`false`)」を指定できます。
            * `winactor-initial-department-id` WinActor登録時の所属の初期値。値には「共有所属の所属ID」または「未所属の所属ID(`<undefined>`)」を指定できます。
            * `winactor-config-file-id` WinActor初回接続時の一括設定ファイルID。値にはWinActor初回接続時に設定する「一括設定ファイルのファイルID」を指定できます。設定中の値をクリアする場合は空文字列を指定します。
            * `task-processing-order-type` シナリオ実行順序。値には「タスク生成順(`createdTime`)」または「タスク実行予定日時順(`scheduleTime`)」を指定できます。
            * `task-interrupt-prevention` 連続実行中の割り込み防止可否。値には「割り込みを防止する(`true`)」または「割り込みを防止しない(`false`)」を指定できます。
            * `task-processing-timeout` シナリオ実行時のタイムアウト初期値（単位は秒）。値には`0`または`60`から`86400`までの整数が指定できます。`0`の場合は無制限になります。空文字列を指定した場合は`1800`を設定します。
            * `task-waiting-timeout` タスク待機期限（単位は分）。値には`0`から`1440`までの整数が指定できます。`0`の場合は無制限になります。
            * `user-initial-auto-logout` オートログアウト初期値（単位は秒）。値には`60`から`86400`までの整数が指定できます。空文字列を指定した場合は`1800`を設定します。
          type: string
          maxLength: 32
        value:
          description: 更新対象のパラメータに設定する値を指定します。
          type: string
          maxLength: 32
      required:
        - key
        - value
    OptionForOperationRequest:
      type: object
      properties:
        items:
          description: 設定項目
          type: array
          items:
            $ref: "#/components/schemas/OptionForOperationItem"
    OptionForOperationResponse:
      type: object
      properties:
        winactorDeleteAssignedTask:
          description: タスク割り当て済みWinActorの削除可否。「削除可能とする(`true`)」または「削除不可とする(`false`)」が返却されます。
          type: boolean
          default: true
        winactorDeleteAssignedUser:
          description: ユーザ割り当て済みWinActorの削除可否。「削除可能とする(`true`)」または「削除不可とする(`false`)」が返却されます。
          type: boolean
          default: true
        winactorOperationFunctionTag:
          description: 機能タグ設定時の動作。「機能タグ未設定のシナリオ実行を許可する(`empty`)」または「機能タグ完全一致のみシナリオ実行を許可する(`exact`)」が返却されます。
          type: string
          default: "string"
        winactorInitialAssignedTask:
          description: WinActor登録時のタスク割り当て可否。「割り当て可能とする(`true`)」または「割り当て不可とする(`false`)」が返却されます。
          type: boolean
          default: true
        winactorInitialDepartmentId:
          description: WinActor登録時の所属の初期値。「共有所属の所属ID」または「未所属の所属ID(`<undefined>`)」が返却されます。
          type: string
          default: "string"
        winactorConfigFileId:
          description: WinActo初回接続時の一括設定ファイルID。
          type: string
          maxLength: 32
        winactorConfigFileName:
          description: WinActo初回接続時の一括設定ファイル名。
          type: string
        taskProcessingOrderType:
          description: シナリオ実行順序。「タスク生成順(`createdTime`)」または「タスク実行予定日時順(`scheduleTime`)」が返却されます。
          type: string
          default: "string"
        taskInterruptPrevention:
          description: 連続実行中の割り込み防止可否。「割り込みを防止する(`true`)」または「割り込みを防止しない(`false`)」が返却されます。
          type: boolean
          default: false
        taskProcessingTimeout:
          description: シナリオ実行時のタイムアウト初期値（単位は秒）。0が返却された場合は、無制限を表します。
          type: integer
          default: 1800
          minimum: 60
          maximum: 86400
        taskWaitingTimeout:
          description: タスク待機期限（単位は分）。
          type: integer
          default: 0
          minimum: 0
          maximum: 1440
        userInitialAutoLogout:
          description: オートログアウト初期値（単位は秒）。
          type: integer
          default: 1800
          minimum: 60
          maximum: 86400
    WinactorDeleteAssignedTaskResponse:
      type: object
      properties:
        winactorDeleteAssignedTask:
          description: タスク割り当て済みWinActorの削除可否。「削除可能とする(`true`)」または「削除不可とする(`false`)」が返却されます。
          type: boolean
