  /departments/csv:
    post:
      summary: 所属インポート
      description: |
        所属情報のインポート
        ===

        所属情報をインポートします。
      security:
        - Token: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: |
                    CSVファイルを格納します。新規登録時のCSVファイルの各行のカラム構成は
                    '親所属名,子所属名,孫所属名,備考'
                    となります。また、先頭行はヘッダ行とし、以下の固定データが入ります。
                    'name1,name2,name3,description'
                    更新時のCSVファイルの各行のカラム構成は
                    '所属ID,親所属名,子所属名,孫所属名,備考,変更後の所属名'
                    となります。また、先頭行はヘッダ行とし、以下の固定データが入ります。
                    'id,name1,name2,name3,description,newName'
                    削除時のCSVファイルの各行のカラム構成は
                    '所属ID,親所属名,子所属名,孫所属名,備考'
                    となります。また、先頭行はヘッダ行とし、以下の固定データが入ります。
                    'id,name1,name2,name3,description'
                    なお、改行コードは「CRLF」とします。
                    すべての処理区分において、親所属名は必須となります。
                    ヘッダを除き10000件を超えるファイルの場合、エラーとなります。
                  type: string
                  format: binary
                encoding:
                  description: |
                    文字コードを指定します。`MS932`、`UTF-8`のいずれかを指定します。未設定時は`MS932`を指定したものとみなします。
                  type: string
                executeType:
                  description: |
                    処理区分を指定します。`I`(新規登録)、`U`(更新)、`D`(削除)のいずれかを指定します。
                  type: string
      responses:
        201:
          $ref: "#/components/responses/OK"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: 所属エクスポート
      description: |
        所属情報のエクスポート
        ===

        指定された条件を満たす所属情報をエクスポートします。
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/Encoding"
        - $ref: "#/components/parameters/DepartmentListGetIdType"
        - $ref: "#/components/parameters/DepartmentListGetId"
        - $ref: "#/components/parameters/Department1"
        - $ref: "#/components/parameters/Department2"
        - $ref: "#/components/parameters/Department3"
      responses:
        200:
          description: |
            正常応答を返却します。ボディにはCSVファイルを格納します。CSVファイルの各行のカラム構成は
            '所属ID,親所属名,子所属名,孫所属名,備考,変更後の所属名'
            となります。また、先頭行はヘッダ行とし、以下の固定データが配置されます。
            'id,name1,name2,name3,description,newName'
            なお、改行コードは「CRLF」となります。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalServerError"
