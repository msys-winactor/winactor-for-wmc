[tool.poetry]
name = "winactor_for_wmc"
packages = [
    { include = "winactor_for_wmc", from = "src" }
]
version = "1.0.0"
description = "winactor_for_wmc project"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.scripts]
copy-to-public = "tools.package_copy_to_public:main"
release = "tools.release:main"
vendor = "tools.vendor_packages:main"
generate-manual = "tools.generate_manual:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
requests = ">=2.32.3,<3.0.0"
cryptography = ">=44.0.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.0"
pre-commit = "^4.2.0"
flake8-pyproject = "^1.2.3"
pyarmor = "^9.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.6.0"
pyyaml = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.winactor]
# WinActor 実行環境の Python バージョン（ベンダリング・PyArmor のターゲット）
target-python = "3.12"
target-arch = "32"

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E402", "W503"]
per-file-ignores = [
    "src/winactor_nodes/**: E999"
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.manual]
site-name = "WinActor for WMC マニュアル"
pages = [
    { title = "ライセンス認証", path = "setup/license.md", section = "導入ガイド" },
    { title = "WinActor for WMC のインストール", path = "setup/install.md", section = "導入ガイド" },
    { title = "WinActor の設定", path = "setup/winactor.md", section = "導入ガイド" },
]
