name: Build InnoSetup Installer

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python バージョン"
        required: false
        default: "3.12.8"
      architecture:
        description: "アーキテクチャ (x86 / x64)"
        required: false
        default: "x86"
        type: choice
        options:
          - x86
          - x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ── バージョン取得 ─────────────────────────────────────
      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── Python & PyArmor セットアップ ──────────────────────
      - name: Set up Python (${{ inputs.architecture }})
        uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"
          architecture: ${{ inputs.architecture }}

      - name: Install PyArmor
        run: python -m pip install --upgrade --no-cache-dir pyarmor

      - name: Restore PyArmor license
        shell: bash
        run: |
          mkdir -p ./license
          echo "${{ secrets.PYARMOR_LICENSE }}" | base64 --decode > ./license/pyarmor-regfile-11041.zip
          pyarmor reg ./license/pyarmor-regfile-11041.zip

      # ── ビルド用ステージングディレクトリ作成 ────────────────
      - name: Prepare staging directory
        shell: bash
        run: mkdir -p staging

      # ── PyArmor で winactor_for_wmc を暗号化 ───────────────
      - name: Obfuscate winactor_for_wmc with PyArmor
        shell: bash
        run: |
          pyarmor gen -r \
            --platform ${{ inputs.architecture == 'x86' && 'windows.x86' || 'windows.x86_64' }} \
            -O staging \
            src/winactor_for_wmc
          echo "=== Staging directory contents ==="
          ls -la staging/

      # ── 依存パッケージを _vendor にバンドル ────────────────
      - name: Vendor dependencies
        shell: bash
        run: |
          VENDOR_DIR="staging/winactor_for_wmc/_vendor"
          TEMP_DIR=".temp_vendor"

          mkdir -p "$VENDOR_DIR"
          echo '"""Vendored dependencies"""' > "$VENDOR_DIR/__init__.py"

          # 32bit Windows 用に pycryptodome をダウンロード
          python -m pip install \
            --target "$TEMP_DIR" \
            --platform ${{ inputs.architecture == 'x86' && 'win32' || 'win_amd64' }} \
            --python-version 3.12 \
            --only-binary=:all: \
            --no-deps \
            pycryptodome>=3.21.0

          # requests とその依存関係 (pure Python)
          python -m pip install \
            --target "$TEMP_DIR" \
            --no-deps \
            "requests>=2.32.3,<3.0.0" \
            certifi \
            charset_normalizer \
            idna \
            urllib3

          # 必要なパッケージだけ _vendor にコピー
          for pkg in requests Crypto certifi charset_normalizer idna urllib3; do
            if [ -d "$TEMP_DIR/$pkg" ]; then
              cp -r "$TEMP_DIR/$pkg" "$VENDOR_DIR/$pkg"
              echo "  Copied: $pkg"
            else
              echo "  Warning: $pkg not found"
            fi
          done

          # 不要ファイルを削除
          find "$VENDOR_DIR" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$VENDOR_DIR" -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find "$VENDOR_DIR" -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find "$VENDOR_DIR" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true

          rm -rf "$TEMP_DIR"
          echo "=== Vendor complete ==="

      # ── ステージング確認 ──────────────────────────────────
      - name: Verify staging contents
        shell: bash
        run: |
          echo "=== pyarmor_runtime_011041 ==="
          ls -la staging/pyarmor_runtime_011041/ || echo "NOT FOUND"
          echo ""
          echo "=== winactor_for_wmc (top level) ==="
          ls -la staging/winactor_for_wmc/
          echo ""
          echo "=== winactor_for_wmc/_vendor ==="
          ls -la staging/winactor_for_wmc/_vendor/

      # ── InnoSetup でインストーラーをビルド ─────────────────
      - name: Build installer with InnoSetup
        shell: cmd
        run: |
          iscc /DMyAppVersion=${{ steps.version.outputs.value }} /DSourceDir=%GITHUB_WORKSPACE%\staging installer\installer.iss
          echo === Installer output ===
          dir installer\Output\

      # ── アーティファクトのアップロード ─────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: winactor-for-wmc-setup-v${{ steps.version.outputs.value }}
          path: installer/Output/winactor-for-wmc-setup-v${{ steps.version.outputs.value }}.exe

      # ── GitHub Release に公開 ──────────────────────────────
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}-installer
          name: "WinActor for WMC v${{ steps.version.outputs.value }} Installer"
          files: installer/Output/winactor-for-wmc-setup-v${{ steps.version.outputs.value }}.exe
